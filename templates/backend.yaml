apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lol-analysis.name" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lol-analysis.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "lol-analysis.selector" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "lol-analysis.selector" . | nindent 8 }}
        app.kubernetes.io/component: backend
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - {name: ROFL_REPORT_ROOT, value: /var/lib/rofl-analysis/reports}
            - {name: ROFL_UPLOAD_ROOT, value: /var/lib/rofl-analysis/uploads}
            - {name: ROFL_CACHE_ROOT, value: /var/lib/rofl-analysis/cache}
            - {name: RIOT_DATA_ROOT, value: /var/lib/rofl-analysis/riot}
            - {name: RIOT_API_TIMEOUT_SECONDS, value: {{ .Values.riot.timeoutSeconds | quote }}}
            {{- if .Values.riot.enabled }}
            {{- if not .Values.riot.existingSecret }}
            {{- fail "values.riot.existingSecret is required when values.riot.enabled=true" }}
            {{- end }}
            - name: RIOT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.riot.existingSecret }}
                  key: {{ .Values.riot.apiKeyKey }}
            - name: RIOT_COLLECT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.riot.existingSecret }}
                  key: {{ .Values.riot.collectorTokenKey }}
            {{- end }}
          ports:
            - {name: http, containerPort: {{ .Values.backend.port }} }
          startupProbe:
            httpGet: {path: /health/live, port: http}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 20
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: reports, mountPath: /var/lib/rofl-analysis}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: reports
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim: {claimName: {{ include "lol-analysis.reportsClaimName" . }}}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lol-analysis.name" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lol-analysis.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  selector:
    {{- include "lol-analysis.selector" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - {name: http, port: {{ .Values.backend.port }}, targetPort: http}
