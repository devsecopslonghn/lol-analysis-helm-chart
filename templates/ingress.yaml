{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "lol-analysis.name" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    portal.drgdevlab.com/title: LoL Replay Analysis
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.domain }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: {name: {{ include "lol-analysis.name" . }}-backend, port: {number: {{ .Values.backend.port }}}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: {{ include "lol-analysis.name" . }}-frontend, port: {number: {{ .Values.frontend.port }}}}
  tls:
    - hosts: [{{ .Values.domain }}]
{{- end }}
