apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "lol-analysis.name" . }}-test-connection"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lol-analysis.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: docker.io/library/busybox:1.36
      command: ["wget"]
      args: ["-qO-", "http://{{ include "lol-analysis.name" . }}-backend:{{ .Values.backend.port }}/health/live"]
