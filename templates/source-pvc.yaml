{{- if and .Values.persistence.enabled .Values.persistence.preserveSourceClaim .Values.persistence.sourceClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.persistence.sourceClaim }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lol-analysis.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration-source
spec:
  accessModes: {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  storageClassName: {{ .Values.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.persistence.sourceSize }}
{{- end }}
