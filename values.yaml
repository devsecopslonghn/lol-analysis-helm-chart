domain: lol-analysis.apps.drgdevlab.com

image:
  pullPolicy: IfNotPresent
  pullSecret: ghcr-pull
  backend:
    repository: ghcr.io/devsecopslonghn/lol-analysis-backend
    tag: "d63bd68693264e879112298a9cd97d2d20c1315c"
  frontend:
    repository: ghcr.io/devsecopslonghn/lol-analysis-frontend
    tag: "84d3730ccf7b3bb1d2d26e8ff062834dc62a611b"

backend:
  replicas: 1
  port: 8080
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}

frontend:
  replicas: 1
  port: 8080
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

persistence:
  enabled: true
  storageClassName: longhorn-workers
  accessModes: [ReadWriteOnce]
  size: 10Gi

ingress:
  # Frontend and API are exposed under the same host for browser access.
  enabled: true
  className: nginx
  # Backend accepts replay files up to 128 MiB; leave room for multipart overhead.
  maxBodySize: 140m

networkPolicy:
  enabled: false

podAnnotations: {}
