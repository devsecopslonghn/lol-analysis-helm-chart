domain: lol-analysis.apps.drgdevlab.com

image:
  pullPolicy: IfNotPresent
  pullSecret: ghcr-pull
  backend:
    repository: ghcr.io/devsecopslonghn/lol-analysis-backend
    tag: "dd120930cad07366b0de274f5861b63ab3ef9159"
  frontend:
    repository: ghcr.io/devsecopslonghn/lol-analysis-frontend
    tag: "a055af8c7193ac9bea87c4b0b4ce064b27ec27e9"

backend:
  replicas: 1
  port: 8080
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}

frontend:
  replicas: 1
  port: 8080
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

persistence:
  enabled: true
  storageClassName: longhorn-workers
  accessModes: [ReadWriteOnce]
  size: 10Gi

ingress:
  # Frontend and API are exposed under the same host for browser access.
  enabled: true
  className: nginx
  # Backend accepts replay files up to 128 MiB; leave room for multipart overhead.
  maxBodySize: 140m

networkPolicy:
  enabled: false

podAnnotations: {}
