domain: lol-analysis.apps.drgdevlab.com

image:
  pullPolicy: IfNotPresent
  pullSecret: ghcr-pull
  backend:
    repository: ghcr.io/devsecopslonghn/lol-analysis-backend
    tag: "dd120930cad07366b0de274f5861b63ab3ef9159"
  frontend:
    repository: ghcr.io/devsecopslonghn/lol-analysis-frontend
    tag: "17d92f8dce523c7055aeadb306717a4d1d3ee68e"

backend:
  replicas: 1
  port: 8080
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}

# Riot credentials are supplied through an existing Kubernetes Secret. Keep
# this disabled until the secret exists in the release namespace.
riot:
  enabled: false
  existingSecret: ""
  apiKeyKey: RIOT_API_KEY
  collectorTokenKey: RIOT_COLLECT_TOKEN
  timeoutSeconds: "15"

frontend:
  replicas: 1
  port: 8080
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

persistence:
  enabled: true
  storageClassName: longhorn-workers
  accessModes: [ReadWriteOnce]
  size: 10Gi

ingress:
  # Frontend and API are exposed under the same host for browser access.
  enabled: true
  className: nginx
  # Backend accepts replay files up to 128 MiB; leave room for multipart overhead.
  maxBodySize: 140m

networkPolicy:
  enabled: false

podAnnotations: {}
