domain: lol-analysis.apps.drgdevlab.com

image:
  pullPolicy: IfNotPresent
  # GHCR images are public by default. Set this only if package visibility is private.
  pullSecret: ""
  backend:
    repository: ghcr.io/devsecopslonghn/lol-analysis-backend
    tag: "708c33be224ad9ff837ae83c43399d3c45d0b849"
  frontend:
    repository: ghcr.io/devsecopslonghn/lol-analysis-frontend
    tag: "10e87ae03651d635784617e8530dd5261cf9e51d"

backend:
  replicas: 1
  port: 8080
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}

frontend:
  replicas: 1
  port: 8080
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

persistence:
  enabled: true
  storageClassName: longhorn-workers
  accessModes: [ReadWriteOnce]
  size: 10Gi

ingress:
  # Frontend and API are exposed under the same host for browser access.
  enabled: true
  className: nginx

networkPolicy:
  enabled: false

podAnnotations: {}
